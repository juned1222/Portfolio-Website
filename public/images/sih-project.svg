<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c071e"/>
      <stop offset="50%" stop-color="#150a2e"/>
      <stop offset="100%" stop-color="#070312"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241348" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#120826" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad1)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="650" cy="120" r="140" fill="#a855f7" opacity="0.12" filter="url(#glow)"/>
  <circle cx="150" cy="380" r="120" fill="#6366f1" opacity="0.12" filter="url(#glow)"/>

  <!-- SIH Badge -->
  <g transform="translate(48, 45)">
    <rect width="180" height="34" rx="17" fill="#2d1558" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="18" cy="17" r="6" fill="#10b981" filter="url(#glow)"/>
    <text x="34" y="22" fill="#e9d5ff" font-family="'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="1">SIH 2026 PROJECT</text>
  </g>

  <!-- Title / Metric -->
  <text x="48" y="125" fill="#ffffff" font-family="'Geist', 'Inter', sans-serif" font-size="24" font-weight="700">AI Legal Metrology Compliance</text>
  <text x="48" y="152" fill="#c084fc" font-family="'Inter', sans-serif" font-size="14" font-weight="400">Automated Package Screening &amp; Evidence-Based Verification</text>

  <!-- Main Dashboard Card -->
  <g transform="translate(48, 180)">
    <!-- Main glass box -->
    <rect width="420" height="260" rx="14" fill="url(#cardGrad)" stroke="#4c1d95" stroke-width="1.5"/>
    
    <!-- Top toolbar -->
    <circle cx="24" cy="24" r="5" fill="#ef4444"/>
    <circle cx="40" cy="24" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="24" r="5" fill="#10b981"/>
    <rect x="80" y="16" width="220" height="16" rx="8" fill="#1b0c36"/>
    <text x="95" y="28" fill="#a78bfa" font-family="monospace" font-size="10">ai-compliance-scanner://v2.6</text>

    <!-- Scan Area Box -->
    <rect x="24" y="55" width="220" height="130" rx="10" fill="#0d051c" stroke="#7c3aed" stroke-dasharray="4,4"/>
    <!-- Scanner Bar -->
    <line x1="24" y1="120" x2="244" y2="120" stroke="#c084fc" stroke-width="2" filter="url(#glow)"/>
    <rect x="35" y="70" width="80" height="12" rx="4" fill="#2e1065"/>
    <rect x="35" y="90" width="120" height="8" rx="4" fill="#3b0764"/>
    <rect x="35" y="105" width="95" height="8" rx="4" fill="#3b0764"/>
    <rect x="35" y="140" width="160" height="10" rx="4" fill="#2e1065"/>
    <text x="145" y="172" fill="#34d399" font-family="'Inter', sans-serif" font-size="11" font-weight="700">✓ 99.4% VERIFIED</text>

    <!-- Side metric stats -->
    <g transform="translate(260, 55)">
      <rect width="135" height="58" rx="8" fill="#1a0b33" stroke="#581c87" stroke-width="1"/>
      <text x="12" y="24" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Accuracy Rate</text>
      <text x="12" y="47" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="20" font-weight="700">98.8%</text>

      <rect y="72" width="135" height="58" rx="8" fill="#1a0b33" stroke="#581c87" stroke-width="1"/>
      <text x="12" y="96" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">API Latency</text>
      <text x="12" y="119" fill="#a855f7" font-family="'Inter', sans-serif" font-size="20" font-weight="700">&lt; 140ms</text>
    </g>

    <!-- Status pill -->
    <rect x="24" y="205" width="372" height="35" rx="8" fill="#16082c" stroke="#3b0764"/>
    <text x="38" y="227" fill="#d8b4fe" font-family="'Inter', sans-serif" font-size="12">Integration: Multi-Model Vision AI &amp; React Frontend</text>
  </g>

  <!-- Right Side Interactive Card -->
  <g transform="translate(495, 180)">
    <rect width="255" height="260" rx="14" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5"/>
    <text x="24" y="38" fill="#ffffff" font-family="'Inter', sans-serif" font-size="15" font-weight="600">Verification Pipeline</text>
    
    <!-- Pipeline steps -->
    <g transform="translate(24, 60)">
      <circle cx="12" cy="12" r="12" fill="#7c3aed"/>
      <text x="8" y="16" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="700">1</text>
      <text x="35" y="16" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="12">Product Ingestion</text>
      <line x1="12" y1="24" x2="12" y2="44" stroke="#7c3aed" stroke-width="2"/>

      <circle cx="12" cy="56" r="12" fill="#6366f1"/>
      <text x="8" y="60" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="700">2</text>
      <text x="35" y="60" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="12">AI Metrology Parsing</text>
      <line x1="12" y1="68" x2="12" y2="88" stroke="#6366f1" stroke-width="2"/>

      <circle cx="12" cy="100" r="12" fill="#a855f7"/>
      <text x="8" y="104" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="700">3</text>
      <text x="35" y="104" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="12">Compliance Rules Engine</text>
      <line x1="12" y1="112" x2="12" y2="132" stroke="#a855f7" stroke-width="2"/>

      <circle cx="12" cy="144" r="12" fill="#10b981"/>
      <text x="8" y="148" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="700">4</text>
      <text x="35" y="148" fill="#34d399" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Audit &amp; Human Review</text>
    </g>
  </g>
</svg>
