<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05131d"/>
      <stop offset="50%" stop-color="#082333"/>
      <stop offset="100%" stop-color="#020d14"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad2)"/>
  
  <!-- Geo Grid & Wave Contours -->
  <path d="M0,180 Q200,120 400,170 T800,140" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4"/>
  <path d="M0,240 Q250,190 500,250 T800,210" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.3"/>
  <path d="M0,320 Q200,280 450,330 T800,290" fill="none" stroke="#0284c7" stroke-width="1.5" opacity="0.25"/>

  <!-- Glowing Water & Hydro Orbs -->
  <circle cx="680" cy="140" r="130" fill="#06b6d4" opacity="0.1" filter="url(#glow2)"/>
  <circle cx="120" cy="380" r="100" fill="#3b82f6" opacity="0.12" filter="url(#glow2)"/>

  <!-- RAMSITA 2026 Recognition Badge -->
  <g transform="translate(48, 45)">
    <rect width="265" height="34" rx="17" fill="#1e293b" stroke="#eab308" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="7" fill="#fbbf24" filter="url(#glow2)"/>
    <text x="36" y="22" fill="#fef08a" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="1">RAMSITA 2026 RECOGNITION</text>
  </g>

  <!-- Research Title -->
  <text x="48" y="125" fill="#ffffff" font-family="'Geist', 'Inter', sans-serif" font-size="22" font-weight="700">Hydrogeochemical &amp; Health-Risk Assessment</text>
  <text x="48" y="152" fill="#7dd3fc" font-family="'Inter', sans-serif" font-size="13.5" font-weight="400">Fluorinated Groundwater in Madhya Pradesh · Engineering Mitigation Strategies</text>

  <!-- Left Card: Hydrogeochemical Data Model -->
  <g transform="translate(48, 180)">
    <rect width="410" height="260" rx="14" fill="#071a26" fill-opacity="0.85" stroke="#0e7490" stroke-width="1.5"/>
    
    <text x="24" y="35" fill="#e0f2fe" font-family="'Inter', sans-serif" font-size="14" font-weight="600">Multi-Scale Spatial Analysis (MP Region)</text>
    
    <!-- Geo chart representation -->
    <g transform="translate(24, 55)">
      <rect width="362" height="115" rx="8" fill="#02121c" stroke="#155e75"/>
      <!-- Hydrogeochemical points -->
      <circle cx="50" cy="70" r="9" fill="#0284c7" opacity="0.7"/>
      <circle cx="50" cy="70" r="4" fill="#38bdf8"/>
      <circle cx="110" cy="40" r="14" fill="#f43f5e" opacity="0.6"/>
      <circle cx="110" cy="40" r="5" fill="#fda4af"/>
      <circle cx="180" cy="85" r="8" fill="#0284c7" opacity="0.7"/>
      <circle cx="250" cy="50" r="16" fill="#f43f5e" opacity="0.7" filter="url(#glow2)"/>
      <circle cx="250" cy="50" r="6" fill="#fff"/>
      <circle cx="310" cy="80" r="10" fill="#0284c7" opacity="0.7"/>
      
      <!-- Connectors -->
      <line x1="50" y1="70" x2="110" y2="40" stroke="#06b6d4" stroke-width="1.2" stroke-dasharray="3,3"/>
      <line x1="110" y1="40" x2="180" y2="85" stroke="#06b6d4" stroke-width="1.2" stroke-dasharray="3,3"/>
      <line x1="180" y1="85" x2="250" y2="50" stroke="#06b6d4" stroke-width="1.2" stroke-dasharray="3,3"/>
      <line x1="250" y1="50" x2="310" y2="80" stroke="#06b6d4" stroke-width="1.2" stroke-dasharray="3,3"/>

      <text x="20" y="105" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Sampling Nodes &amp; Chemical Speciation Index</text>
    </g>

    <!-- Metrics row -->
    <g transform="translate(24, 185)">
      <rect width="170" height="48" rx="8" fill="#041f2d" stroke="#083344"/>
      <text x="12" y="20" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Target Area</text>
      <text x="12" y="38" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="14" font-weight="600">Madhya Pradesh, IN</text>

      <rect x="185" width="175" height="48" rx="8" fill="#041f2d" stroke="#083344"/>
      <text x="12" y="20" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Impact Scope</text>
      <text x="12" y="38" fill="#34d399" font-family="'Inter', sans-serif" font-size="14" font-weight="600">Health-Risk Mitigation</text>
    </g>
  </g>

  <!-- Right Card: Distinguished Award -->
  <g transform="translate(485, 180)">
    <rect width="265" height="260" rx="14" fill="#071d2b" fill-opacity="0.9" stroke="#eab308" stroke-width="1.5"/>
    
    <g transform="translate(132, 50)">
      <circle cx="0" cy="0" r="28" fill="#78350f" stroke="#fbbf24" stroke-width="2" filter="url(#glow2)"/>
      <text x="0" y="8" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="22" text-anchor="middle">★</text>
    </g>

    <text x="132" y="105" fill="#ffffff" font-family="'Geist', 'Inter', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Distinguished</text>
    <text x="132" y="125" fill="#facc15" font-family="'Inter', sans-serif" font-size="14" font-weight="600" text-anchor="middle">Research Contribution</text>
    
    <rect x="25" y="145" width="215" height="1" fill="#334155"/>

    <text x="132" y="172" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11.5" text-anchor="middle">Presented at 2nd RAMSITA</text>
    <text x="132" y="190" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">International Conference</text>
    <text x="132" y="222" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Feb 2026 · Recognition</text>
  </g>
</svg>
