<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0926"/>
      <stop offset="50%" stop-color="#190e38"/>
      <stop offset="100%" stop-color="#0a0518"/>
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bgGrad3)"/>
  
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="266" y1="0" x2="266" y2="500"/>
    <line x1="533" y1="0" x2="533" y2="500"/>
  </g>

  <circle cx="650" cy="180" r="140" fill="#a855f7" opacity="0.15" filter="url(#glow3)"/>
  <circle cx="150" cy="350" r="120" fill="#3b82f6" opacity="0.12" filter="url(#glow3)"/>

  <!-- Badge -->
  <g transform="translate(48, 45)">
    <rect width="210" height="34" rx="17" fill="#2d1558" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="6" fill="#60a5fa" filter="url(#glow3)"/>
    <text x="36" y="22" fill="#e9d5ff" font-family="'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="1">FULL STACK &amp; APIS</text>
  </g>

  <!-- Title -->
  <text x="48" y="125" fill="#ffffff" font-family="'Geist', 'Inter', sans-serif" font-size="24" font-weight="700">Modern Web Applications</text>
  <text x="48" y="152" fill="#c084fc" font-family="'Inter', sans-serif" font-size="14" font-weight="400">React · Node.js · HTML5 · CSS3 · API Driven Architecture</text>

  <!-- IDE Window Card -->
  <g transform="translate(48, 180)">
    <rect width="430" height="260" rx="14" fill="#140a2b" stroke="#6b21a8" stroke-width="1.5"/>
    
    <!-- Code header -->
    <circle cx="24" cy="24" r="5" fill="#ef4444"/>
    <circle cx="40" cy="24" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="24" r="5" fill="#10b981"/>
    <text x="80" y="28" fill="#94a3b8" font-family="monospace" font-size="11">App.tsx — React + Node API</text>

    <!-- Code Mockup -->
    <g transform="translate(24, 55)" font-family="Consolas, monospace" font-size="12">
      <text y="20" fill="#c084fc">import</text>
      <text x="50" y="20" fill="#f8fafc">{ useState, useEffect }</text>
      <text x="215" y="20" fill="#c084fc">from</text>
      <text x="250" y="20" fill="#86efac">"react"</text>

      <text y="50" fill="#c084fc">export const</text>
      <text x="95" y="50" fill="#60a5fa">AppPipeline</text>
      <text x="180" y="50" fill="#f8fafc">= () =&gt; {</text>

      <text x="20" y="80" fill="#c084fc">const</text>
      <text x="65" y="80" fill="#f8fafc">[data, setData] = </text>
      <text x="190" y="80" fill="#60a5fa">useAPIState</text>
      <text x="268" y="80" fill="#f8fafc">();</text>

      <text x="20" y="110" fill="#64748b">// High-performance responsive frontend</text>
      
      <text x="20" y="140" fill="#c084fc">return</text>
      <text x="70" y="140" fill="#f8fafc">&lt;</text>
      <text x="80" y="140" fill="#38bdf8">InteractiveView</text>
      <text x="195" y="140" fill="#f8fafc">source={data} /&gt;</text>

      <text y="170" fill="#f8fafc">};</text>
    </g>

    <!-- Bottom Tech Pills -->
    <g transform="translate(24, 215)">
      <rect width="65" height="24" rx="12" fill="#2e1065"/>
      <text x="32" y="16" fill="#e9d5ff" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">React</text>

      <rect x="75" width="70" height="24" rx="12" fill="#2e1065"/>
      <text x="110" y="16" fill="#e9d5ff" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Node.js</text>

      <rect x="155" width="60" height="24" rx="12" fill="#2e1065"/>
      <text x="185" y="16" fill="#e9d5ff" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">HTML5</text>

      <rect x="225" width="55" height="24" rx="12" fill="#2e1065"/>
      <text x="252" y="16" fill="#e9d5ff" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">CSS3</text>

      <rect x="290" width="85" height="24" rx="12" fill="#2e1065"/>
      <text x="332" y="16" fill="#a7f3d0" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">REST APIs</text>
    </g>
  </g>

  <!-- Right Visual Pill Card -->
  <g transform="translate(505, 180)">
    <rect width="245" height="260" rx="14" fill="#130928" stroke="#4c1d95" stroke-width="1.5"/>
    <text x="24" y="38" fill="#ffffff" font-family="'Inter', sans-serif" font-size="15" font-weight="600">Frontend Stack</text>

    <g transform="translate(24, 65)">
      <rect width="195" height="36" rx="8" fill="#1e103d" stroke="#581c87"/>
      <circle cx="20" cy="18" r="5" fill="#38bdf8"/>
      <text x="36" y="22" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="12">Interactive React UI</text>

      <rect y="48" width="195" height="36" rx="8" fill="#1e103d" stroke="#581c87"/>
      <circle cx="20" cy="18" r="5" fill="#22c55e"/>
      <text x="36" y="22" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="12">Node.js API Services</text>

      <rect y="96" width="195" height="36" rx="8" fill="#1e103d" stroke="#581c87"/>
      <circle cx="20" cy="18" r="5" fill="#eab308"/>
      <text x="36" y="22" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="12">Responsive Layouts</text>

      <rect y="144" width="195" height="36" rx="8" fill="#1e103d" stroke="#581c87"/>
      <circle cx="20" cy="18" r="5" fill="#ec4899"/>
      <text x="36" y="22" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="12">State &amp; Event Handling</text>
    </g>
  </g>
</svg>
